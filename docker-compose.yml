services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      PGHOST: postgres
      PGUSER: lcp
      PGPASSWORD: ${POSTGRES_PASSWORD:-lcp-local-demo}
      DATABASE_URL: postgresql+psycopg:///lcp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lcp
      POSTGRES_USER: lcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lcp-local-demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lcp", "-d", "lcp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
