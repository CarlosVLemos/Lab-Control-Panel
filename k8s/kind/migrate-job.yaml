apiVersion: batch/v1
kind: Job
metadata:
  name: lcp-migrate
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: lcp-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic
          image: lcp-api:kind-v1
          imagePullPolicy: Never
          command: [alembic, upgrade, head]
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: lcp
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lcp-postgres
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg:///lcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
