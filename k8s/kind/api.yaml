apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: lcp-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lcp-api
  template:
    metadata:
      labels:
        app: lcp-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: lcp-api:kind-v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: development
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: lcp
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lcp-postgres
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg:///lcp
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
