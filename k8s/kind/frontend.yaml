apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: lcp-frontend
  ports:
    - name: http
      port: 5173
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lcp-frontend
  template:
    metadata:
      labels:
        app: lcp-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: lcp-frontend:kind-v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5173
          env:
            - name: VITE_API_PROXY_TARGET
              value: http://api:8000
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
