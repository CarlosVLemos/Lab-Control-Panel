name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lcp
          POSTGRES_PASSWORD: lcp-ci
          POSTGRES_DB: lcp_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U lcp -d lcp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LCP_TEST_DATABASE_URL: postgresql+psycopg://lcp:lcp-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/lcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest -q
      - run: docker compose config -q
      - name: Verify Compose restart and persistence
        run: |
          docker compose up --build --wait
          docker compose exec -T api alembic upgrade head
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U lcp -d lcp -c "INSERT INTO projects (id, slug, name) VALUES ('compose-smoke', 'compose-smoke', 'Compose smoke test')"
          docker compose down
          docker compose up --wait
          test "$(docker compose exec -T postgres psql -At -U lcp -d lcp -c "SELECT id FROM projects WHERE id = 'compose-smoke'")" = compose-smoke
      - if: always()
        run: docker compose down
